name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12: the exact pins (requirements.lock needs Python >= 3.10).
          - python-version: "3.12"
            requirements: requirements.lock
          # 3.9: the oldest supported version (README, ruff target), with
          # the lower-bound ranges from requirements.txt.
          - python-version: "3.9"
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (pydub to_mp3 in tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r ${{ matrix.requirements }} -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (CLI tools, archived backend, dispatcher)
        run: pytest tests backend/tests dispatcher -q

  frontend:
    name: frontend (archived app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
