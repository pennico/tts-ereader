name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: scripts/scan-private.sh --self-test
      - name: No private patterns in the tree, the new commits and their authors
        env:
          # The extra private patterns are the repository secret PRIVATE_PATTERNS (one line), never in this public
          # file. Pushes to main and same-repo pull requests fail without it; pull requests from forks and Dependabot
          # get no secrets and scan with the built-in patterns only (the script prints a notice).
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '0' }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/scan-private.sh --length
          scripts/scan-private.sh
          # The new commits: their messages, added lines and identities.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/scan-private.sh --history "$BEFORE..$AFTER"
          else
            echo "::notice::No earlier commit to compare with (new branch or force push): scanning every commit after the baseline"
            scripts/scan-private.sh --history "$AFTER"
          fi

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9 build; 3.9 = the owner's Mac
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12: the exact pins (requirements.lock needs Python >= 3.10).
          - python-version: "3.12"
            requirements: requirements.lock
          # 3.9: the oldest supported version (README, ruff target), with
          # the lower-bound ranges from requirements.txt.
          - python-version: "3.9"
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (pydub to_mp3 in tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r ${{ matrix.requirements }} -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (CLI tools, archived backend)
        run: pytest tests backend/tests -q

  frontend:
    name: frontend (archived app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
