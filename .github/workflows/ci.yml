name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (pydub to_mp3 in tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps (locked)
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests backend/tests -q
